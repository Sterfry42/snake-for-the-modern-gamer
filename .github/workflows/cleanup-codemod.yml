name: Cleanup codemod

on:
  pull_request:
    types: [reopened]
    branches: ['main']

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'cleanup/reachability-purge'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v5
        with:
          ref: cleanup/reachability-purge
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply audited cleanup codemod
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');

          const snakePath = 'src/game/snakeGame.ts';
          let snake = fs.readFileSync(snakePath, 'utf8');

          const oldImport = "import { buildHouseNpcProfile } from '../npcs/profiles.js';";
          const newImport = "import { createHumanoidIdentity } from '../world/humanoidSpawn.js';";
          const importCount = snake.split(oldImport).length - 1;
          if (importCount !== 1) throw new Error(`Expected 1 legacy profile import, found ${importCount}`);
          snake = snake.replace(oldImport, newImport);

          const callCount = snake.split('buildHouseNpcProfile(').length - 1;
          if (callCount !== 9) throw new Error(`Expected 9 legacy profile calls, found ${callCount}`);
          snake = snake.replaceAll('buildHouseNpcProfile(', 'createHumanoidIdentity(');

          const snakeSource = ts.createSourceFile(snakePath, snake, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const angerMethods = [];
          function collectAnger(node) {
            if (ts.isMethodDeclaration(node) && node.name && node.name.getText(snakeSource) === 'angerNpc') {
              angerMethods.push(node);
            }
            ts.forEachChild(node, collectAnger);
          }
          collectAnger(snakeSource);
          if (angerMethods.length !== 1) throw new Error(`Expected 1 angerNpc method, found ${angerMethods.length}`);

          const anger = angerMethods[0];
          const angerReplacement = `private angerNpc(
            roomId: string,
            reason: 'insult' | 'shot',
          ): { anger: number; hostility: 'friendly' | 'warning' | 'hostile' } | null {
            const room = this.world.getRoom(roomId);
            const giver = room.questGiver;
            if (!giver) {
              return null;
            }
            const current = this.npcDisposition.get(roomId) ?? { anger: 0, hostility: 'friendly' as const };
            const anger = reason === 'shot' ? 99 : current.anger + 1;
            const hostility: 'friendly' | 'warning' | 'hostile' =
              anger >= 2 || reason === 'shot' ? 'hostile' : anger >= 1 ? 'warning' : 'friendly';
            const next = { anger, hostility };
            this.npcDisposition.set(roomId, next);

            if (hostility === 'hostile') {
              this.ensureActorsFromRoomContent(room);
              const actorId = this.getQuestGiverActorId(roomId, giver.id);
              const actor = this.actors.getActor(actorId);
              if (actor && actor.health?.state !== 'dead' && actor.health?.state !== 'downed') {
                const hostilityReason =
                  reason === 'shot' ? 'player-shot-quest-giver' : 'player-insulted-quest-giver';
                this.actors.setPlayerHostility(
                  actorId,
                  'hostile',
                  hostilityReason,
                  this.getRoomsVisitedCount(),
                );
                this.actors.requestGoal(
                  actorId,
                  {
                    kind: 'seekPlayer',
                    priority: 80,
                    roomId,
                    reason: hostilityReason,
                  },
                  { interrupt: true, replaceLowerPriority: true },
                );
              }
            }
            return next;
          }`;
          snake = snake.slice(0, anger.getStart(snakeSource)) + angerReplacement + snake.slice(anger.end);
          fs.writeFileSync(snakePath, snake);

          const worldPath = 'src/world/worldService.ts';
          let world = fs.readFileSync(worldPath, 'utf8');
          const worldSource = ts.createSourceFile(worldPath, world, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const innCases = [];
          function collectInn(node) {
            if (ts.isCaseClause(node) && ts.isStringLiteral(node.expression) && node.expression.text === 'inn') {
              innCases.push(node);
            }
            ts.forEachChild(node, collectInn);
          }
          collectInn(worldSource);
          if (innCases.length !== 5) throw new Error(`Expected 5 dead inn cases, found ${innCases.length}`);
          for (const clause of innCases.sort((a, b) => b.getStart(worldSource) - a.getStart(worldSource))) {
            world = world.slice(0, clause.getStart(worldSource)) + world.slice(clause.end);
          }
          fs.writeFileSync(worldPath, world);
          NODE

      - name: Format touched files
        run: npx prettier --write src/game/snakeGame.ts src/world/worldService.ts src/world/town.ts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Commit cleanup and remove runner
        run: |
          git rm .github/workflows/cleanup-codemod.yml
          git config user.name 'cleanup-bot'
          git config user.email 'cleanup-bot@users.noreply.github.com'
          git add src/game/snakeGame.ts src/world/worldService.ts src/world/town.ts
          git commit -m 'Cleanup: finish humanoid identity and actor combat migration'
          git push origin HEAD:cleanup/reachability-purge
